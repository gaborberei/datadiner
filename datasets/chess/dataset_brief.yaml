# =============================================================================
# DATASET BRIEF — read this first
# =============================================================================
# This file is the analyst-facing context: everything a data team would
# realistically know about this dataset. It contains NO spoilers (the planted
# shocks are for you to find). Do NOT open any answer key (ground_truth_*) that
# may sit in this folder before your analysis is written down.

brief_version: 1

schema:
  granularity: event                  # one row per logged event (has event_time)
  time_column: event_time
  user_column: user_id
  primary_key: [event_time, user_id, event_type]

analysis:
  core_action: game_played            # the only event type; "active" = played a game
  natural_frequency: weekly
  segment_cols: [segment, acquisition_channel, country, platform]

data_quality:
  sparsity: active_periods_only       # a user has rows only in periods they were active
  event_count_min: 1
  # A handful of exact (event_time, user_id, event_type) repeats from
  # second-resolution timestamps — benign, declared so the gate treats it as a
  # known quirk rather than a substituted file.
  primary_key_dupes_max: 4

dataset:
  file: chess_games_events.csv
  product: "Chess.com-like app; the single core action is playing a game"
  description: >
    Event-level product-analytics data for calendar year 2024. Players sign up in
    weekly cohorts and play games — this is a SINGLE-EVENT dataset (only
    game_played). The activity series carries genuine time-series variance
    (seasonality, autocorrelated noise) and at least one news-driven spike. No A/B
    experiments ran.
  rows: 477963
  users: 19063

task:
  - >
    Characterize retention & engagement: build the cohort retention curve and the
    weekly-active-player series; read the lifecycle and Quick Ratio.
  - >
    Find anomalies in the activity/volume series: WHEN, MAGNITUDE, plausible ROOT
    CAUSE (seasonality vs a real spike vs noise). The number of shocks is not given.
  - >
    Summarize overall product health: growth, retention, seasonality.

grain: >
  One row per game_played event: (event_time, user_id, event_type) plus the
  player's fixed dimensions. A player appears only in periods they played, so
  retention must be derived from presence/absence after bucketing event_time into
  weeks. First event = signup; first active week = the Monday-week of
  min(event_time). event_type is constant (game_played).

retention_metric:
  activity_definition: >
    A player is ACTIVE in a week if they have at least one game_played row that week.
  cohort_definition: >
    Signup cohort = FIRST active week (cohort_week = the Monday-week of
    min(event_time) per user). Signup and first activity coincide.
  retention_rate: >
    Classic N-week (calendar-week, non-rolling) retention:
    retention(cohort, age) = unique cohort players active in week
    (cohort_week + age) / cohort size. Age 0 is 1.0 by construction.
  churn_and_resurrection: >
    Churn is just absence. Players CAN return after inactive weeks, so curves need
    not be monotonic; compute each (cohort, age) cell independently.
  weekly_active_users: >
    WAU(week) = unique user_ids with a game_played row that week — the headline series.

time_coverage:
  start_week: "2024-01-01"   # a Monday; weeks run Mon-Sun
  end_week: "2024-12-29"
  n_weeks: 52                # abs_week 0..51

columns:
  event_time:
    type: date
    description: "timestamp of the game (one row per game played)"
    values: "2024-01-01 .. 2024-12-29"
  date:
    type: date
    description: "calendar day of the game (derived from event_time)"
  week:
    type: date
    description: "Monday of the activity week"
  abs_week:
    type: int
    description: "0-indexed week number from the start of the data"
    values: "0 .. 51"
  user_id:
    type: string
    description: "stable pseudonymous player key, e.g. user_000045"
  event_type:
    type: string
    description: "always game_played in this dataset"
    values:
      game_played: "player completed a game. The core production event and the only event type; one row per game."
  segment:
    type: string
    description: "latent behavioural cohort assigned at signup (engagement level)"
    values: [casual, core, power]
  acquisition_channel:
    type: string
    description: "how the player was acquired; fixed at signup"
    values: [organic, paid_search, referral, social]
  country:
    type: string
    description: "player country; fixed at signup"
    values: [US, DE, UK, IN, BR, PH, RU]
  platform:
    type: string
    description: "primary platform; fixed at signup"
    values: [web, ios, android]

known_context:
  experiments: []                     # no A/B experiments in this dataset
  releases:
    - "no app-version splits in this dataset"
  beliefs:
    - "playing on more distinct days early is believed to predict long-term retention better than raw game count"
    - "player engagement is heavy-tailed: a committed minority plays most of the games"
    - "chess interest is seasonal and reacts to news events (expect spikes around major chess news)"

hints:
  - "since there is one event type, games-per-week = row count per (user, week)"
  - "cut retention and the WAU series by signup cohort, segment, channel, platform, country"
