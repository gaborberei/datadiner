# =============================================================================
# DATASET BRIEF — read this first
# =============================================================================
# This file is the analyst-facing context: everything a data team would
# realistically know about this dataset. It contains NO spoilers.
# The answer key (ground_truth_config.yaml / ground_truth_users.csv) lives in
# this same folder — do NOT open it before your analysis is written down.

brief_version: 1
answer_key: "ground_truth_config.yaml — do NOT open before your analysis is written down"

# Machine-readable layer: lets analysis tooling (e.g. the activation pipeline's
# brief.py) configure itself without guessing. Extra keys are allowed anywhere.
schema:
  granularity: event                  # one row per logged event (has event_time)
  time_column: event_time
  # no count_column — this is a per-event log, not a weekly/daily aggregate
  primary_key: [event_time, user_id, event_type]
  dtypes:
    app_version: str                  # parses as float otherwise ("2.3" -> 2.3)

analysis:
  core_action: page_created           # the core production event (see columns below)
  natural_frequency: weekly
  # retention_horizon_weeks: 12       # not pinned — pick from the curve
  setup_window_days: 1
  aha_window_days: 7
  habit_window_days: 28
  segment_cols: [segment, acquisition_channel, country, platform, app_version]

data_quality:
  sparsity: active_periods_only       # a user has rows only in periods they were active
  event_count_min: 1

dataset:
  file: notion_causal_events.csv
  product: "Notion-like collaboration app (pages, AI assistant, sharing, comments, tables)"
  description: >
    Event-level product-analytics data for calendar year 2024. Users sign up in
    weekly cohorts and create/view content. Somewhere in this year a number of
    real-world incidents ("shocks") left marks on the data. This is the beginner
    dataset — the shocks are designed to be detectable. No A/B experiments ran.
  rows: 8207444
  users: ~9749

task:
  - >
    Find the anomalies/shocks: for each, identify WHEN (weeks), WHICH metric(s)
    it moved, the approximate MAGNITUDE, and the most plausible ROOT CAUSE
    (product change, marketing, outage, tracking, competition). The number and
    type of shocks is not given.
  - >
    Summarize overall product health: growth, retention, engagement mix.
  - >
    (Activation lens) Define the habit / aha / setup moments and read out the
    activation funnel and segmented survival.

grain: >
  One row per logged event: (event_time, user_id, event_type) plus the user's
  fixed dimensions repeated on every row. A user appears only in periods they
  were active, so retention/churn must be derived from presence/absence after
  bucketing event_time into weeks. A user's first event is their signup; first
  active week = the Monday-week of min(event_time).

retention_metric:
  activity_definition: >
    A user is ACTIVE in a week if they have at least one event that week,
    regardless of event_type (every active week also contains at least one
    page_created).
  cohort_definition: >
    A user's signup cohort is their FIRST active week (cohort_week =
    the Monday-week of min(event_time) per user). Signup and first activity
    coincide.
  retention_rate: >
    Classic N-week (calendar-week, non-rolling) retention:
    retention(cohort, age) = unique cohort users active in week
    (cohort_week + age) / cohort size. Age 0 is 1.0 by construction.
  churn_and_resurrection: >
    Churn is just absence — there is no churn event. Users CAN return after
    inactive weeks, so per-cohort curves need not be monotonic; compute each
    (cohort, age) cell independently.
  weekly_active_users: >
    WAU(week) = unique user_ids with any event that week — the headline series.

time_coverage:
  start_week: "2024-01-01"   # a Monday; weeks run Mon-Sun
  end_week: "2024-12-27"
  n_weeks: 52                # abs_week 0..51

columns:
  event_time:
    type: date
    description: "timestamp of the individual event (one row per event)"
    values: "2024-01-01 .. 2024-12-27"
  date:
    type: date
    description: "calendar day of the event (derived from event_time)"
  week:
    type: date
    description: "Monday of the activity week"
  abs_week:
    type: int
    description: "0-indexed week number from the start of the data"
    values: "0 .. 51"
  user_id:
    type: string
    description: "stable pseudonymous user key, e.g. user_000041"
  event_type:
    type: string
    description: "what the user did; one logged action per row"
    values:
      page_created: >
        user created a new page/document. The core production event: every
        active user creates at least one page per active week.
      page_view: >
        user opened/viewed a page (their own or someone else's). The
        consumption-side event and the highest-volume type; believed to be
        downstream of content activity.
      used_ai: "user invoked the AI writing assistant on a page (one event per invocation)"
      shared: "user shared a page with another person/workspace (one event per share)"
      commented: "user posted a comment on a page (one event per comment)"
      created_table: "user added a table/database block to a page (one event per table)"
      upgraded: "user's plan moved up one tier (free->pro or pro->team). Rare by design."
      downgraded: "user's plan moved down one tier; same mechanics as upgraded. Rare."
  segment:
    type: string
    description: "latent behavioural cohort assigned at signup (engagement level)"
    values: [casual, core, power]
  acquisition_channel:
    type: string
    description: "how the user was acquired; fixed at signup"
    values: [organic, paid_search, referral, social]
  country:
    type: string
    description: "user country; fixed at signup"
    values: [US, DE, UK, IN, BR]
  platform:
    type: string
    description: "primary platform; fixed at signup"
    values: [web, ios, android]
  app_version:
    type: string
    description: >
      app release the user is on (users adopt new releases gradually). NOTE:
      parse as string (dtype={'app_version': str}), otherwise loads as float.
    values: ["2.3", "2.4"]

known_context:
  experiments: []                     # no A/B experiments in this dataset
  releases:
    - "release 2.4 appears mid-year; existing users adopted it gradually"
  plans:
    - "three plan tiers exist (free, pro, team); tier changes show up as upgraded/downgraded events"
    - "current tier is not a column; approximate it from the change events"
  beliefs:
    - "page views are believed to be driven by content activity (pages created, shares, AI usage)"
    - "user-level engagement is heavy-tailed: a small power-user group accounts for a large share of events"

hints:
  - "aggregate events to weekly totals per event_type first; index each series to a common base week"
  - "cut retention by signup cohort (first active week) as well as by calendar week"
  - "segment / channel / platform / app_version cuts are there for root-cause isolation"
