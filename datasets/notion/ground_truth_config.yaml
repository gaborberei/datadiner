dataset_name: notion_causal
global_settings:
  base_users: 100
  growth_rate: 0.025
  start_date: '2024-01-01'
  periods_to_simulate: 52
dimensions:
  acquisition_channel:
    values:
      organic: 0.4
      paid_search: 0.3
      social: 0.2
      referral: 0.1
    retention_multiplier:
      organic: 1.0
      paid_search: 0.8
      social: 0.85
      referral: 1.15
  country:
    values:
      US: 0.4
      DE: 0.15
      UK: 0.12
      IN: 0.18
      BR: 0.15
  platform:
    values:
      web: 0.5
      ios: 0.3
      android: 0.2
releases:
  adoption_rate: 0.3
  versions:
  - version: '2.3'
    week: 0
  - version: '2.4'
    week: 20
plans:
  levels:
  - free
  - pro
  - team
  multipliers:
    activity:
      free: 1.0
      pro: 1.2
      team: 1.35
    retention:
      free: 1.0
      pro: 1.05
      team: 1.35
  signup_distribution:
    casual:
      free: 0.97
      pro: 0.03
      team: 0.0
    core:
      free: 0.75
      pro: 0.22
      team: 0.03
    power:
      free: 0.35
      pro: 0.5
      team: 0.15
  weekly_transitions:
    upgrade: 0.012
    downgrade: 0.004
shocks:
- type: acquisition
  start_week: 10
  end_week: 14
  multiplier: 0.4
  description: Marketing Paused (Weeks 10-14)
- type: feature
  target_feature: used_ai
  start_week: 25
  end_week: 28
  multiplier: 0.0
  description: AI Server Crash (Zero Usage Wk 25-28)
- type: retention
  start_week: 40
  end_week: 52
  multiplier: 0.7
  description: Competitor Launch (High Churn Wk 40+)
causality:
  base_views: 5
  noise_scale: 0.1
  weights:
    shared: 5.0
    used_ai: 3.0
    page_created: 2.0
    created_table: 1.0
    commented: 1.0
  activity_weights:
    used_ai: 1.5
  marginal_page_multiplier:
    shared: 0.5
    commented: 0.7
segments:
  casual:
    prob: 0.5
    retention:
      plateau: 0.1
      decay: 0.2
    activity_distribution:
      type: poisson
      lambda: 0.4
    feature_probabilities:
      used_ai: 0.05
      created_table: 0.1
      commented: 0.05
      shared: 0.15
  core:
    prob: 0.4
    retention:
      plateau: 0.5
      decay: 0.1
    activity_distribution:
      type: normal
      loc: 3
      scale: 1.5
    feature_probabilities:
      used_ai: 0.3
      created_table: 0.6
      commented: 0.3
      shared: 0.2
  power:
    prob: 0.1
    retention:
      plateau: 0.9
      decay: 0.025
    activity_distribution:
      type: lognormal
      mean: 2.5
      sigma: 0.5
    feature_probabilities:
      used_ai: 0.85
      created_table: 0.9
      commented: 0.8
      shared: 0.5
